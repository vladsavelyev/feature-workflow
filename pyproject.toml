[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-workflow"
version = "0.1.0"
description = "Parallel feature workflow: branches, worktrees, PRs, and GitHub-issue-backed review tracking with a merge gate."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
feature = "feature_workflow.__main__:main"
feature-session-context = "feature_workflow.session_start_hook:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/feature_workflow/tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Wraps git/git-town/gh/claude via subprocess with developer-supplied args — no untrusted
# input, no shell=True.
"src/feature_workflow/shell.py" = ["S603"]
"src/feature_workflow/tests/**" = ["S101"]
